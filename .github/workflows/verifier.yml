# Les tests ne valent que s'ils tournent sans qu'on y pense.
#
# ─── POURQUOI CE FICHIER EXISTE ───
#
# Le 27 août 2026, sept dépôts publics de ce portfolio affichaient un vert d'intégration
# continue qui ne mesurait rien : le seul tour enregistré était « pages build and
# deployment », c'est-à-dire GitHub copiant des fichiers vers son hébergement. Aucune suite
# ne tournait. Le vert était sincère et vide — il ne POUVAIT PAS rougir sur un défaut de
# code. C'est pire que pas de vert du tout, parce qu'il rassure.
#
# ─── CE DÉPÔT N'A NI `package.json` NI DÉPENDANCE, ET C'EST VOULU ───
#
# Sa suite tourne sur Node seul — mesuré : 20 cas, aucun `node_modules`. Il n'y a donc ni
# installation ni cache ici, et il ne faut pas en ajouter « par symétrie » avec les dépôts
# voisins : un `npm install` sans manifeste échouerait, et un cache sans verrou de
# dépendances aussi. La chaîne d'un dépôt se dérive de ce qu'il est, jamais du dépôt d'à côté.
name: verifier

on:
  push:
    branches: [main]
  pull_request:

# Sans ce bloc, GitHub donne au jeton les droits par défaut du dépôt, écriture comprise —
# et la passe tourne aussi sur `pull_request`, donc sur du code proposé de l'extérieur.
# Signalé par CodeQL sur un dépôt voisin.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique entier : plusieurs cas de ce portfolio interrogent git. Sur le clone
          # à profondeur 1 par défaut ils tombent, et ils ont raison de tomber.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ─── UN CAS IGNORÉ N'EST PAS UN CAS PASSÉ ───
      #
      # `node --test` rend 0 quand des cas s'ignorent. Sur un dépôt voisin, la construction
      # est restée verte pendant que la promesse centrale du produit n'était éprouvée sur
      # rien : le cas qui la vérifiait s'ignorait faute de ressource.
      #
      # La porte est NOMINATIVE et la liste est VIDE ici : aucun cas ne s'ignore aujourd'hui,
      # et le premier qui le fera sera rouge. Un plafond, lui, laisserait un contrôle
      # s'éteindre tant qu'un autre se rallume.
      #
      # `pipefail` parce qu'un tube mange le code de sortie : sans lui, la suite pourrait
      # échouer et la passe continuer jusqu'à la porte, qui conclurait sur une sortie tronquée.
      - name: suite, et aucun cas ignoré hors de la liste nominative
        run: |
          set -o pipefail
          node --test *.test.mjs 2>&1 | tee /tmp/suite.txt
          sh .github/verifier-ignores.sh /tmp/suite.txt .github/cas-ignores-attendus.txt
